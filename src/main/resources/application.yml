spring:
  profiles:
    active: dev
  application:
    name: Demo
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        ddl-auto: update # validate | update | create | create-drop
        show_sql: true
        format_sql: true
        use_sql_comments: true
        generate_statistics: true
    open-in-view: false
  datasource:
    password: mysql
    username: mysql
    url: jdbc:mysql://localhost:3306/mydatabase
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0
      location: ""
      max-file-size: "1000MB"
      max-request-size: "1000MB"
      resolve-lazily: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
logging:
  level:
    com.luanvv: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
server:
  port: 80
  connection-timeout: 20000
  servlet:
    application-display-name: Spring demo
    session:
      cookie:
        max-age: 10800
      timeout: 1200
  max-http-header-size: 0

# Added Spring Actuator properties
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  trace:
    http:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  devtools:
    livereload:
      enabled: false
  logging:
    config: classpath:log4j2-prod.xml

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mkyong?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.jdbc.Driver
  logging:
    config: classpath:log4j2-dev.xml
  server:
    port: 8080
